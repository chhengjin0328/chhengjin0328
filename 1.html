<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下班倒计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0a1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none;
  }

  canvas#particles {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .container {
    position: relative; z-index: 1;
    text-align: center;
    animation: fadeIn 1.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .title {
    font-size: 1.4rem; font-weight: 300;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
  }

  .status-text {
    font-size: 1.1rem; font-weight: 400;
    margin-bottom: 32px;
    min-height: 28px;
    transition: color 0.5s;
  }
  .status-text.working { color: #6ee7b7; }
  .status-text.done    { color: #f9a8d4; }
  .status-text.resting { color: #93c5fd; }

  .countdown {
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .time-block {
    display: flex; flex-direction: column; align-items: center;
    min-width: 120px;
    padding: 16px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .time-block:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(110, 231, 183, 0.15);
  }

  .time-value {
    font-size: 5rem; font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #6ee7b7, #3b82f6, #a78bfa);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    font-variant-numeric: tabular-nums;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .time-label {
    font-size: 0.8rem; font-weight: 400;
    color: rgba(255,255,255,0.35);
    margin-top: 8px; letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .separator {
    font-size: 3rem; font-weight: 300;
    color: rgba(255,255,255,0.2);
    animation: blink 1s ease-in-out infinite;
    padding-bottom: 20px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }

  .progress-wrap {
    width: 420px; max-width: 90vw;
    margin: 0 auto 36px;
    position: relative;
  }

  .progress-bar {
    width: 100%; height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6ee7b7, #3b82f6);
    border-radius: 4px;
    transition: width 1s linear;
    box-shadow: 0 0 12px rgba(110, 231, 183, 0.4);
  }

  .progress-text {
    font-size: 0.85rem; color: rgba(255,255,255,0.35);
    margin-top: 8px;
  }

  /* Settings button */
  .settings-btn {
    position: fixed; top: 24px; right: 24px; z-index: 10;
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    color: rgba(255,255,255,0.5);
    font-size: 1.2rem;
  }
  .settings-btn:hover {
    background: rgba(255,255,255,0.12);
    transform: rotate(60deg);
    color: #fff;
  }

  /* Settings panel */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    background: rgba(20, 20, 40, 0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px;
    width: 380px; max-width: 90vw;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.35s;
  }
  .overlay.open .panel {
    transform: translateY(0) scale(1);
  }

  .panel h2 {
    font-size: 1.3rem; font-weight: 600;
    margin-bottom: 24px; text-align: center;
    color: rgba(255,255,255,0.85);
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block; font-size: 0.85rem;
    color: rgba(255,255,255,0.45);
    margin-bottom: 8px;
  }
  .field input[type="time"] {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: #fff; font-size: 1.1rem;
    outline: none; transition: border-color 0.3s;
    color-scheme: dark;
  }
  .field input[type="time"]:focus {
    border-color: #6ee7b7;
  }

  .btn-row {
    display: flex; gap: 12px; margin-top: 28px;
  }
  .btn {
    flex: 1; padding: 12px;
    border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 500;
    cursor: pointer; transition: all 0.25s;
  }
  .btn-cancel {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.6);
  }
  .btn-cancel:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-save {
    background: linear-gradient(135deg, #6ee7b7, #3b82f6);
    color: #0a0a1a; font-weight: 600;
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(110,231,183,0.3); }

  /* Done celebration */
  .celebration {
    display: none;
    font-size: 1.8rem; font-weight: 700;
    background: linear-gradient(135deg, #f9a8d4, #a78bfa, #6ee7b7);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 2s ease infinite, celebratePulse 1.5s ease-in-out infinite;
  }
  .celebration.show { display: block; }
  @keyframes celebratePulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* Current time */
  .current-time {
    position: fixed; bottom: 24px;
    font-size: 0.8rem; color: rgba(255,255,255,0.2);
    z-index: 1;
  }

  @media (max-width: 600px) {
    .time-block { min-width: 80px; padding: 12px 8px; }
    .time-value { font-size: 3rem; }
    .separator  { font-size: 2rem; }
    .title { font-size: 1.1rem; }
    .progress-wrap { width: 300px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <div class="title">下 班 倒 计 时</div>
  <div class="status-text working" id="statusText">努力工作中...</div>
  <div class="countdown" id="countdown">
    <div class="time-block">
      <span class="time-value" id="hours">00</span>
      <span class="time-label">时</span>
    </div>
    <span class="separator">:</span>
    <div class="time-block">
      <span class="time-value" id="minutes">00</span>
      <span class="time-label">分</span>
    </div>
    <span class="separator">:</span>
    <div class="time-block">
      <span class="time-value" id="seconds">00</span>
      <span class="time-label">秒</span>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">工作进度 0%</div>
  </div>
  <div class="celebration" id="celebration">下班啦！尽情享受自由时光！</div>
</div>

<button class="settings-btn" id="settingsBtn" title="设置下班时间">⚙</button>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>设置下班时间</h2>
    <div class="field">
      <label>下班时间</label>
      <input type="time" id="timeInput" value="18:00">
    </div>
    <div class="field">
      <label>上班时间（用于计算进度）</label>
      <input type="time" id="startTimeInput" value="09:00">
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" id="cancelBtn">取消</button>
      <button class="btn btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="current-time" id="currentTime"></div>

<script>
// ── Settings ──
const STORAGE_KEY = 'countdown_offwork_time';
const STORAGE_START_KEY = 'countdown_start_time';

function getEndTime() {
  return localStorage.getItem(STORAGE_KEY) || '18:00';
}
function getStartTime() {
  return localStorage.getItem(STORAGE_START_KEY) || '09:00';
}

function toToday(str) {
  const [h, m] = str.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

// ── UI refs ──
const $hours = document.getElementById('hours');
const $minutes = document.getElementById('minutes');
const $seconds = document.getElementById('seconds');
const $progressFill = document.getElementById('progressFill');
const $progressText = document.getElementById('progressText');
const $statusText = document.getElementById('statusText');
const $countdown = document.getElementById('countdown');
const $celebration = document.getElementById('celebration');
const $overlay = document.getElementById('overlay');
const $timeInput = document.getElementById('timeInput');
const $startTimeInput = document.getElementById('startTimeInput');
const $currentTime = document.getElementById('currentTime');

// ── Settings panel ──
document.getElementById('settingsBtn').addEventListener('click', () => {
  $timeInput.value = getEndTime();
  $startTimeInput.value = getStartTime();
  $overlay.classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => {
  $overlay.classList.remove('open');
});
$overlay.addEventListener('click', (e) => {
  if (e.target === $overlay) $overlay.classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', () => {
  localStorage.setItem(STORAGE_KEY, $timeInput.value);
  localStorage.setItem(STORAGE_START_KEY, $startTimeInput.value);
  $overlay.classList.remove('open');
});

// ── Countdown logic ──
let lastH = '', lastM = '', lastS = '';

function pad(n) { return String(n).padStart(2, '0'); }

function animateValue(el, newVal) {
  if (el.textContent === newVal) return;
  el.style.transition = 'transform 0.3s, opacity 0.3s';
  el.style.transform = 'translateY(-8px)';
  el.style.opacity = '0.3';
  setTimeout(() => {
    el.textContent = newVal;
    el.style.transform = 'translateY(8px)';
    requestAnimationFrame(() => {
      el.style.transform = 'translateY(0)';
      el.style.opacity = '1';
    });
  }, 150);
}

function tick() {
  const now = new Date();
  const end = toToday(getEndTime());
  const start = toToday(getStartTime());

  // Current time display
  $currentTime.textContent = `当前时间 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  let diff = end - now;
  const isDone = diff <= 0;
  const isBeforeWork = now < start;

  if (isDone) {
    $statusText.textContent = '已下班，享受生活！';
    $statusText.className = 'status-text done';
    $countdown.style.display = 'none';
    $celebration.classList.add('show');
    $progressFill.style.width = '100%';
    $progressText.textContent = '工作进度 100% — 今日已完成';
    return;
  }

  if (isBeforeWork) {
    $statusText.textContent = '还没上班呢，再睡会儿~';
    $statusText.className = 'status-text resting';
    $countdown.style.display = 'flex';
    $celebration.classList.remove('show');
    // show time until work starts
    diff = start - now;
  } else {
    $statusText.textContent = '努力工作中...';
    $statusText.className = 'status-text working';
    $countdown.style.display = 'flex';
    $celebration.classList.remove('show');
  }

  const totalSec = Math.floor(diff / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;

  const hStr = pad(h), mStr = pad(m), sStr = pad(s);
  animateValue($hours, hStr);
  animateValue($minutes, mStr);
  animateValue($seconds, sStr);

  // Progress
  if (!isBeforeWork) {
    const total = end - start;
    const elapsed = now - start;
    const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
    $progressFill.style.width = pct.toFixed(2) + '%';
    $progressText.textContent = `工作进度 ${pct.toFixed(1)}%`;
  } else {
    $progressFill.style.width = '0%';
    $progressText.textContent = '工作进度 0% — 还未开始';
  }
}

tick();
setInterval(tick, 1000);

// ── Particle System ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(true); }

  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 20;
    this.size = Math.random() * 2.5 + 0.5;
    this.baseSize = this.size;
    this.speedX = (Math.random() - 0.5) * 0.6;
    this.speedY = -(Math.random() * 0.4 + 0.15);
    // Irregular motion params
    this.angle = Math.random() * Math.PI * 2;
    this.angleSpeed = (Math.random() - 0.5) * 0.02;
    this.wobbleAmp = Math.random() * 1.2 + 0.3;
    this.wobbleFreq = Math.random() * 0.03 + 0.01;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.02 + 0.01;
    // Color
    const colors = [
      [110, 231, 183], // green
      [59, 130, 246],  // blue
      [167, 139, 250], // purple
      [249, 168, 212], // pink
      [251, 191, 36],  // amber
    ];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.alpha = Math.random() * 0.5 + 0.15;
    this.life = 0;
    this.maxLife = Math.random() * 600 + 300;
  }

  update() {
    this.life++;
    this.angle += this.angleSpeed;
    this.pulsePhase += this.pulseSpeed;

    // Irregular motion: sine wobble + slow drift
    const wobbleX = Math.sin(this.angle * this.wobbleFreq * 60) * this.wobbleAmp;
    const wobbleY = Math.cos(this.angle * this.wobbleFreq * 40) * this.wobbleAmp * 0.5;

    this.x += this.speedX + wobbleX;
    this.y += this.speedY + wobbleY;

    // Pulsing size
    this.size = this.baseSize * (0.8 + 0.4 * Math.sin(this.pulsePhase));

    // Fade based on life
    const lifeRatio = this.life / this.maxLife;
    if (lifeRatio < 0.1) {
      this.currentAlpha = this.alpha * (lifeRatio / 0.1);
    } else if (lifeRatio > 0.8) {
      this.currentAlpha = this.alpha * (1 - (lifeRatio - 0.8) / 0.2);
    } else {
      this.currentAlpha = this.alpha;
    }

    if (this.life >= this.maxLife || this.x < -20 || this.x > W + 20 || this.y < -20) {
      this.reset(false);
    }
  }

  draw() {
    const [r, g, b] = this.color;
    const a = this.currentAlpha || this.alpha;
    // Glow
    ctx.beginPath();
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    gradient.addColorStop(0, `rgba(${r},${g},${b},${a * 0.6})`);
    gradient.addColorStop(0.5, `rgba(${r},${g},${b},${a * 0.15})`);
    gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gradient;
    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.fill();
  }
}

// Connection lines
function drawConnections(particles) {
  const maxDist = 120;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = dx * dx + dy * dy;
      if (dist < maxDist * maxDist) {
        const alpha = (1 - Math.sqrt(dist) / maxDist) * 0.08;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(110,231,183,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

const PARTICLE_COUNT = 80;
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// Mouse interaction
let mouse = { x: -1000, y: -1000 };
document.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
document.addEventListener('mouseleave', () => {
  mouse.x = -1000; mouse.y = -1000;
});

function animate() {
  ctx.clearRect(0, 0, W, H);

  // Subtle radial gradient background glow
  const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
  bgGrad.addColorStop(0, 'rgba(20, 30, 60, 0.15)');
  bgGrad.addColorStop(1, 'rgba(10, 10, 26, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Update & draw particles
  for (const p of particles) {
    // Mouse repulsion
    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 150) {
      const force = (150 - dist) / 150 * 0.8;
      p.x += (dx / dist) * force;
      p.y += (dy / dist) * force;
    }
    p.update();
    p.draw();
  }

  drawConnections(particles);
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
